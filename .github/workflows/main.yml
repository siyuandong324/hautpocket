name: Build HAUTPocket APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Auto-locate Project and Build APK
        run: |
          GRADLE_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "错误：仓库里还没有上传代码文件，请先去 Code 标签页上传解压后的文件！"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: HAUTPocket-v0.32.0-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
